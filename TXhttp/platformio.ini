; TXhttp - la placa manda la trama del sensor al orquestador por HTTP POST.
;
; No usa LoRa ni LoRaBoards: WiFi.h y HTTPClient.h ya vienen dentro del core
; de Arduino para ESP32, asi que este proyecto no necesita ninguna libreria
; externa. Por eso no hay lib_deps.

[env:ttgo-t-beam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
